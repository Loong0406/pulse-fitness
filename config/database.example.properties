# Copy to database.local.properties. Never commit the local password file.
# The database must exist. Start-Server.ps1 loads this file only when explicitly supplied.
DB_URL=jdbc:mysql://127.0.0.1:3306/pulse_fitness?connectionTimeZone=UTC&connectTimeout=5000&socketTimeout=10000
DB_USER=pulse_app
DB_PASSWORD=REPLACE_WITH_YOUR_DATABASE_PASSWORD
# Demo codes are returned to the app. This is NOT production SMS authentication.
AUTH_DEMO_ENABLED=true
