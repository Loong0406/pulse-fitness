# Java argument files must use the Windows native encoding when paths contain Chinese.
# Source compilation is explicitly UTF-8 in every module.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
